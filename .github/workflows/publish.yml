name: Publish to npmjs.org

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry Run: pack & verify without publishing"
        type: boolean
        default: true

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ github.event.inputs.dry_run == 'true' && 'Dry run' || 'Publish' }}

    runs-on: ubuntu-24.04
    timeout-minutes: 15

    environment: Production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build & Test
        run: npm test

      - name: Pack (Inspect Tarball)
        run: |
          npm pack --dry-run
          echo "---"
          echo "Tarball contents:"
          npm pack --json | jq -r '.[0].files[].path'

      - name: Publish Package to npmjs.org
        if: ${{ github.event_name == 'release' || github.event.inputs.dry_run != 'true' }}
        run: npm publish --access public --provenance

      - name: Dry Run Summary
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "✅ Dry Run complete: the package was built and verified but NOT published."
          echo "   Re-run this workflow with 'Dry Run' unchecked to publish for real."
