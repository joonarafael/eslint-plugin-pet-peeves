name: Publish to npmjs.org

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, as X.Y.Z or vX.Y.Z. Leave empty to run a dry run (pack & verify without publishing)."
        type: string
        default: ""

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.version == '') && 'Dry run' || 'Publish' }}

    runs-on: ubuntu-24.04
    timeout-minutes: 15

    environment:
      name: Production
      url: https://www.npmjs.com/package/eslint-plugin-pet-peeves

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Determine Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            RAW_VERSION="${{ github.event.release.tag_name }}"
          else
            RAW_VERSION="${{ github.event.inputs.version }}"
          fi

          if [ -z "$RAW_VERSION" ]; then
            echo "No version provided; running as a dry run."
            {
              echo "is_dry_run=true"
              echo "version="
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Strip an optional leading "v" (e.g. v1.2.3 -> 1.2.3)
          VERSION="${RAW_VERSION#v}"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$RAW_VERSION' is not a valid version. Expected vX.Y.Z or X.Y.Z (integer.integer.integer)."
            exit 1
          fi

          echo "Resolved version: $VERSION"
          {
            echo "is_dry_run=false"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Set Package Version
        if: steps.version.outputs.is_dry_run != 'true'
        run: npm pkg set version="${{ steps.version.outputs.version }}"

      - name: Build & Test
        run: npm test

      - name: Pack (Inspect Tarball)
        run: |
          npm pack --dry-run
          echo "---"
          echo "Tarball contents:"
          npm pack --json | jq -r '.[0].files[].path'

      - name: Publish Package to npmjs.org
        if: steps.version.outputs.is_dry_run != 'true'
        run: npm publish --access public --provenance

      - name: Dry Run Summary
        if: steps.version.outputs.is_dry_run == 'true'
        run: |
          echo "✅ Dry Run complete: the package was built and verified but NOT published."
          echo "   Re-run this workflow with a version (X.Y.Z or vX.Y.Z) to publish for real."
